name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install flake8
      - name: Lint (non-blocking style check)
        run: flake8 --max-line-length=120 --extend-ignore=E203,W503 app.py database.py services.py security.py money.py || true
      - name: Run tests
        run: pytest -q
